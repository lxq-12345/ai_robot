slam_toolbox:
  ros__parameters:
    use_sim_time: true
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping
    use_map_saver: true
    resolution: 0.05
    minimum_time_interval: 0.2
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.10
    transform_publish_period: 0.05
    map_update_interval: 1.0
    max_laser_range: 8.0
