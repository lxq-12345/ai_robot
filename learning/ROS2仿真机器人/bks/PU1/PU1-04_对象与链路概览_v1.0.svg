<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">ROS 2对象与链路概览</title>
  <desc id="desc">展示本项目任务、导航、运动、传感器、状态反馈和TF链路之间的关系。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#45545f"/>
    </marker>
    <style>
      .title { font: 700 30px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #17212b; }
      .subtitle { font: 400 16px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #52616d; }
      .lane { font: 700 19px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #17212b; }
      .name { font: 700 16px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #20313d; }
      .detail { font: 400 14px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #43515c; }
      .topic { font: 600 13px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #263944; }
      .box { stroke-width: 2; rx: 7; }
      .line { fill: none; stroke: #45545f; stroke-width: 2.2; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #6a7780; stroke-width: 1.8; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="820" fill="#f7f9fa"/>
  <text x="54" y="52" class="title">ROS 2对象与链路概览</text>
  <text x="54" y="80" class="subtitle">节点通过 Topic、Action、Parameter 和 TF 组成完整功能链；箭头表示主要数据或调用方向</text>

  <rect x="40" y="106" width="1120" height="130" fill="#eaf4ee" stroke="#77a889" class="box"/>
  <text x="60" y="136" class="lane">结构化任务与导航链</text>
  <rect x="72" y="156" width="200" height="56" fill="#ffffff" stroke="#77a889" class="box"/>
  <text x="172" y="179" text-anchor="middle" class="name">受控操作端</text>
  <text x="172" y="198" text-anchor="middle" class="detail">测试或人工体验入口</text>
  <rect x="370" y="156" width="226" height="56" fill="#ffffff" stroke="#77a889" class="box"/>
  <text x="483" y="179" text-anchor="middle" class="name">capability_task_manager</text>
  <text x="483" y="198" text-anchor="middle" class="detail">校验、反馈、结果、幂等</text>
  <rect x="707" y="156" width="170" height="56" fill="#ffffff" stroke="#77a889" class="box"/>
  <text x="792" y="179" text-anchor="middle" class="name">Nav2</text>
  <text x="792" y="198" text-anchor="middle" class="detail">规划、控制、恢复</text>
  <rect x="966" y="156" width="160" height="56" fill="#ffffff" stroke="#77a889" class="box"/>
  <text x="1046" y="179" text-anchor="middle" class="name">定位系统</text>
  <text x="1046" y="198" text-anchor="middle" class="detail">map_server + AMCL</text>
  <path d="M272 184 H370" class="line"/>
  <text x="321" y="150" text-anchor="middle" class="topic">/execute_capability_task</text>
  <path d="M596 184 H707" class="line"/>
  <text x="651" y="150" text-anchor="middle" class="topic">/navigate_to_pose</text>
  <path d="M966 203 H877" class="dash"/>
  <text x="920" y="226" text-anchor="middle" class="topic">位姿、地图、TF</text>

  <rect x="40" y="254" width="1120" height="142" fill="#eef3f8" stroke="#7293ae" class="box"/>
  <text x="60" y="284" class="lane">运动控制与状态反馈链</text>
  <rect x="72" y="307" width="180" height="62" fill="#ffffff" stroke="#7293ae" class="box"/>
  <text x="162" y="332" text-anchor="middle" class="name">Nav2 / 受控演示</text>
  <text x="162" y="352" text-anchor="middle" class="detail">速度产生端</text>
  <rect x="354" y="307" width="190" height="62" fill="#ffffff" stroke="#7293ae" class="box"/>
  <text x="449" y="332" text-anchor="middle" class="name">cmd_vel_guard</text>
  <text x="449" y="352" text-anchor="middle" class="detail">限速、超时、雷达新鲜度</text>
  <rect x="650" y="307" width="190" height="62" fill="#ffffff" stroke="#7293ae" class="box"/>
  <text x="745" y="332" text-anchor="middle" class="name">Gazebo差速插件</text>
  <text x="745" y="352" text-anchor="middle" class="detail">仿真底盘执行</text>
  <rect x="946" y="307" width="180" height="62" fill="#ffffff" stroke="#7293ae" class="box"/>
  <text x="1036" y="332" text-anchor="middle" class="name">状态使用端</text>
  <text x="1036" y="352" text-anchor="middle" class="detail">定位、导航、观察</text>
  <path d="M252 338 H354" class="line"/>
  <text x="303" y="326" text-anchor="middle" class="topic">/cmd_vel_raw</text>
  <path d="M544 338 H650" class="line"/>
  <text x="597" y="326" text-anchor="middle" class="topic">/cmd_vel</text>
  <path d="M840 338 H946" class="line"/>
  <text x="893" y="326" text-anchor="middle" class="topic">/odom</text>

  <rect x="40" y="414" width="1120" height="156" fill="#fff5e8" stroke="#c79658" class="box"/>
  <text x="60" y="444" class="lane">传感器数据与诊断链</text>
  <rect x="72" y="470" width="205" height="70" fill="#ffffff" stroke="#c79658" class="box"/>
  <text x="174" y="495" text-anchor="middle" class="name">Gazebo传感器插件</text>
  <text x="174" y="516" text-anchor="middle" class="detail">雷达、相机、IMU</text>
  <rect x="375" y="470" width="250" height="70" fill="#ffffff" stroke="#c79658" class="box"/>
  <text x="500" y="493" text-anchor="middle" class="name">传感器Topic</text>
  <text x="500" y="514" text-anchor="middle" class="detail">/scan · /camera/* · /imu/data</text>
  <rect x="727" y="470" width="170" height="70" fill="#ffffff" stroke="#c79658" class="box"/>
  <text x="812" y="495" text-anchor="middle" class="name">使用节点</text>
  <text x="812" y="516" text-anchor="middle" class="detail">监测、融合、任务、Nav2</text>
  <rect x="997" y="470" width="129" height="70" fill="#ffffff" stroke="#c79658" class="box"/>
  <text x="1061" y="495" text-anchor="middle" class="name">诊断</text>
  <text x="1061" y="516" text-anchor="middle" class="detail">/diagnostics</text>
  <path d="M277 505 H375" class="line"/>
  <path d="M625 505 H727" class="line"/>
  <path d="M897 505 H997" class="line"/>

  <rect x="40" y="588" width="1120" height="114" fill="#f2eef8" stroke="#8c78aa" class="box"/>
  <text x="60" y="618" class="lane">TF空间关系链</text>
  <rect x="102" y="641" width="150" height="38" fill="#ffffff" stroke="#8c78aa" class="box"/>
  <text x="177" y="666" text-anchor="middle" class="name">map</text>
  <rect x="353" y="641" width="150" height="38" fill="#ffffff" stroke="#8c78aa" class="box"/>
  <text x="428" y="666" text-anchor="middle" class="name">odom</text>
  <rect x="604" y="641" width="150" height="38" fill="#ffffff" stroke="#8c78aa" class="box"/>
  <text x="679" y="666" text-anchor="middle" class="name">base_link</text>
  <rect x="855" y="632" width="240" height="56" fill="#ffffff" stroke="#8c78aa" class="box"/>
  <text x="975" y="655" text-anchor="middle" class="name">sensor_link</text>
  <text x="975" y="675" text-anchor="middle" class="detail">laser · camera · imu</text>
  <path d="M252 660 H353" class="line"/>
  <path d="M503 660 H604" class="line"/>
  <path d="M754 660 H855" class="line"/>

  <rect x="40" y="720" width="1120" height="66" fill="#ffffff" stroke="#a3adb4" class="box"/>
  <text x="60" y="748" class="name">启动组合：</text>
  <text x="174" y="748" class="detail">sim_bringup → localization_bringup → nav2_bringup → m6_bringup</text>
  <text x="60" y="772" class="detail">每个上层Launch包含下层能力；SLAM使用独立的slam_bringup。参数决定行为，TF保证所有数据处于可变换的空间关系中。</text>
</svg>
