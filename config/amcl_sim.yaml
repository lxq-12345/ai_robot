amcl:
  ros__parameters:
    use_sim_time: true
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    scan_topic: /scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    min_particles: 100
    max_particles: 500
    update_min_d: 0.05
    update_min_a: 0.05
    transform_tolerance: 0.2
    tf_broadcast: true
